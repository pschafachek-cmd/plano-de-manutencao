<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planos de Manutenção | Filtros</title>
  <style>
    :root{--orange:#e75d12;--ink:#302117;--bg:#fff7f1;--line:#f0d8c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}header{padding:48px max(24px,calc((100% - 1080px)/2));color:#fff;background:radial-gradient(circle at 85% 0,#ffab48 0,transparent 32%),linear-gradient(125deg,#8e2d08,#e75d12)}.tag{color:#ffdf92;font-weight:800;font-size:.75rem;letter-spacing:.14em}h1{max-width:750px;margin:8px 0;font-size:clamp(2.2rem,5vw,4rem);line-height:1.02;letter-spacing:-.045em}header p{max-width:620px;margin:0;color:#fff1e5;font-size:1.05rem}main{width:min(1080px,calc(100% - 36px));margin:30px auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}label{display:block;margin-bottom:6px;color:#806656;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}select{width:100%;padding:13px;border:1px solid #dfc1ae;border-radius:8px;background:#fff;font:inherit}.info{margin:26px 0 14px}.info h2{margin:0;font-size:1.35rem}.info p{margin:4px 0 0;color:#78665a}.cards{display:grid;gap:14px}.card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.head{display:flex;justify-content:space-between;gap:12px;padding:17px 19px;background:#fff0e6}.head h3{margin:0;font-size:1.1rem}.head small{color:#80695b}.badge{height:max-content;padding:4px 9px;border-radius:99px;background:#ffe0bf;color:#a8400a;font-size:.78rem;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:11px 18px;text-align:left;border-top:1px solid #fae6d7}th{color:#806a5d;background:#fffaf7;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}.code{display:inline-block;padding:4px 7px;border-radius:5px;background:#fff0e6;color:#b5460b;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.84rem;font-weight:800}.note{padding:18px;color:#6a5446}.note a{color:var(--orange);font-weight:800}.sources{margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:13px;background:#fff}.sources h2{margin:0 0 12px;font-size:1.1rem}.source-list{display:flex;gap:8px;flex-wrap:wrap}.source-list span{padding:7px 10px;border-radius:99px;background:#fff0e6;color:#9b3e0d;font-size:.84rem;font-weight:750}@media(max-width:620px){header{padding:34px 18px}main{width:min(100% - 26px,1080px)}.filters{grid-template-columns:1fr}th,td{padding:10px;font-size:.87rem}}
    .app-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}.side-nav{position:sticky;top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.side-nav h2{margin:3px 8px 12px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}.category-button{display:flex;width:100%;align-items:center;gap:10px;padding:12px 11px;border:1px solid transparent;border-radius:9px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.category-button:hover,.category-button.active{border-color:#bd5718;background:#fff0e6;color:#a8400a}.category-icon{display:grid;width:27px;height:27px;place-items:center;border-radius:7px;background:#ffe0bf;color:#a8400a;font-weight:900}.category-button small{display:block;margin-top:1px;color:#80695b;font-size:.72rem}.content{min-width:0}@media(max-width:760px){.app-layout{grid-template-columns:1fr}.side-nav{position:static;display:flex;gap:6px;overflow:auto}.side-nav h2{display:none}.category-button{min-width:155px}.filters{grid-template-columns:1fr}}
    /* Tema escuro */
    body{background:#090909;color:#fff4eb}.filters,.card,.sources,.side-nav{background:#151515;border-color:#4a2c18}.head{background:#21150e}.info p,.head small,label,.note,.category-button small{color:#d9b9a5}select{background:#101010;color:#fff4eb;border-color:#6d3b1d}th{background:#19110d;color:#f5b47c}th,td{border-color:#4a2c18}.source-list span,.badge,.category-icon{background:#2a180d;color:#ff9c45}.code{background:#2d1607;color:#ff861c;border:1px solid #8f430d}td:first-child{color:#ff861c}.category-button:hover,.category-button.active{border-color:#a94c14;background:#2a180d;color:#ff9c45}.theme-toggle{position:absolute;top:22px;right:max(24px,calc((100% - 1080px)/2));padding:10px 14px;border:1px solid #ffbd78;border-radius:999px;background:#17100c;color:#ffb36c;font:800 .82rem/1 Inter,system-ui,sans-serif;cursor:pointer}.theme-toggle:hover{background:#2d1607}.corner-logo{position:fixed;right:16px;bottom:14px;z-index:5;width:min(155px,30vw);filter:drop-shadow(0 5px 14px #0009);pointer-events:none}body.light{background:#fff7f1;color:#302117}body.light .filters,body.light .card,body.light .sources,body.light .side-nav{background:#fff;border-color:#f0d8c7}body.light .head{background:#fff0e6}body.light .info p,body.light .head small,body.light label,body.light .note,body.light .category-button small{color:#80695b}body.light select{background:#fff;color:#302117;border-color:#dfc1ae}body.light th{background:#fffaf7;color:#806a5d}body.light th,body.light td{border-color:#fae6d7}body.light .source-list span,body.light .badge,body.light .category-icon{background:#ffe0bf;color:#a8400a}body.light .code{background:#fff0e6;color:#b5460b;border-color:#f0c49d}body.light td:first-child{color:#b5460b}body.light .category-button:hover,body.light .category-button.active{border-color:#bd5718;background:#fff0e6;color:#a8400a}body.light .theme-toggle{background:#fff;color:#873609;border-color:#873609}body.light .theme-toggle:hover{background:#fff0e6}@media(max-width:620px){.theme-toggle{top:14px;right:14px}.corner-logo{width:110px;right:8px;bottom:8px}}
  </style>
</head>
<body>
  <header><div class="tag">CONSULTA DE PEÇAS</div><h1>Plano de manutenção por máquina e horas.</h1><p>Selecione a categoria, o modelo e o intervalo para consultar códigos sem procurar nas planilhas.</p><button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo de cores">☀ Modo claro</button></header>
  <main>
    <div class="app-layout"><aside class="side-nav" aria-label="Categorias de peças"><h2>Selecionar peça</h2><button class="category-button active" data-category="filtros"><span class="category-icon">F</span><span>Filtros<small>Manutenção periódica</small></span></button><button class="category-button" data-category="rodante"><span class="category-icon">R</span><span>Material rodante<small>Esteiras e componentes</small></span></button><button class="category-button" data-category="dentes"><span class="category-icon">D</span><span>Dentes<small>Caçamba e adaptadores</small></span></button></aside><div class="content"><section class="filters"><div><label for="brand">Marca</label><select id="brand"><option value="all">Todas as marcas</option></select></div><div><label for="machine">Modelo</label><select id="machine"></select></div><div><label for="hours">Plano de troca</label><select id="hours"><option value="all">Consulta geral</option><option value="250">250 horas</option><option value="500">500 horas</option><option value="1000">1.000 horas</option></select></div></section>
    <section class="info"><h2 id="title">Filtros</h2><p id="status"></p></section><section class="cards" id="results"></section>
    <aside class="sources"><h2>Pastas de origem catalogadas</h2><div class="source-list"><span>Case e New Holland</span><span>Doosan</span><span>Hyundai</span><span>John Deere</span><span>Komatsu</span><span>Link-Belt X2 e X3</span><span>Sany</span><span>Volvo</span></div></aside></div></div>
  </main>
  <img class="corner-logo" src="logo-escava-pecas.png" alt="Escava Peças">
  <script src="catalog-data.js"></script>
  <script>
    const sany=(name,a,b,c,d,e,f,g,h,i,j,k)=>({name,brand:'Sany',plans:{250:[[a,'Filtro separador de água/óleo'],[b,'Filtro de óleo do motor'],[c,'Filtro de combustível'],[d,'Filtro de combustível']].filter(x=>x[0]!=='—'),500:[[a,'Filtro separador de água/óleo'],[b,'Filtro de óleo do motor'],[c,'Filtro de combustível'],[d,'Filtro de combustível'],[e,'Filtro de ar principal'],[f,'Filtro de ar auxiliar']].filter(x=>x[0]!=='—'),1000:[[a,'Filtro separador de água/óleo'],[b,'Filtro de óleo do motor'],[c,'Filtro de combustível'],[d,'Filtro de combustível'],[e,'Filtro de ar principal'],[f,'Filtro de ar auxiliar'],[g,'Filtro piloto'],[h,'Filtro hidráulico de retorno'],[i,'Filtro hidráulico de sucção'],[j,'Filtro de ar-condicionado interno'],[k,'Filtro de ar-condicionado externo']].filter(x=>x[0]!=='—')}});
    const machines=[
      sany('Sany SY55','B222100000561','A222100000569','B222100000730','60042724','B222100000593','B222100000591','Não informado','60082694','60082693','B222100000713','B222100000660'),
      sany('Sany SY75','B222100000561','A222100000569','B222100000730','60042724','B222100000593','B222100000591','Não informado','60082694','60082693','B222100000713','B222100000660'),
      sany('Sany SY135C','—','B222100000494','B222100000730','60042724','B222100000500','B222100000501','A222100000119','B222100000379','B222100000235','B222100000711','B222100000660'),
      sany('Sany SY215C','60033346 / 60205961','B222100000551 / 67004045','B229900002809','B222100000521 / 60201217 / 67004046','B222100000535 / 67004048','B222100000532 / 67004052','A222100000119','60101256','60101257','B222100000711','B222100000660K'),
      {name:'John Deere 130G / 130GLC',brand:'John Deere',plans:{250:[['RE539279','Filtro de óleo do motor']],500:[['RE539279','Filtro de óleo do motor'],['RE541922','Filtro primário de combustível'],['RE522878','Filtro final de combustível']],1000:[['RE539279','Filtro de óleo do motor'],['RE541922','Filtro primário de combustível'],['RE522878','Filtro final de combustível'],['4448401','Filtro de óleo do tanque hidráulico'],['4630525','Filtro de óleo piloto'],['AT332908','Filtro de ar primário'],['AT332909','Filtro de ar secundário']]}},
      {name:'John Deere 160GLC / 180GLC',brand:'John Deere',plans:{250:[],500:[['RE539279','Filtro de óleo do motor'],['RE529643','Filtro primário de combustível'],['RE522878','Filtro final de combustível']],1000:[['RE539279','Filtro de óleo do motor'],['RE529643','Filtro primário de combustível'],['RE522878','Filtro final de combustível'],['4656608','Filtro de óleo do tanque hidráulico'],['4630525','Filtro de óleo piloto'],['AT332908','Filtro de ar primário'],['AT332909','Filtro de ar secundário']]}},
      {name:'Doosan DX225LC-V',brand:'Doosan',plans:{250:[['65.05510-5028','Filtro de óleo do motor (intervalo de 200 h)']],500:[['2474-9054A','Elemento interno do filtro de ar'],['2474-9053A','Elemento externo do filtro de ar'],['2474-9404A','Filtro do tanque de óleo'],['2471-1154','Filtro piloto']],1000:[['65.12503-5011D','Filtro de combustível do motor (intervalo de 750 h)'],['2474-9016A','Filtro de sucção do tanque de óleo (2.000 h)']]}},
      {name:'Volvo EC140B',brand:'Volvo',catalog:'SANY/EC140B VOLVO ESCAVADEIRA JUNHO 2014 (1).pdf'},
      {name:'Volvo EC220D',brand:'Volvo',catalog:'SANY/EC220D VOLVO ESCAVADEIRA JULHO 2017.pdf'}
    ,...(window.generatedMachines || [])];
    const brand=document.querySelector('#brand'),sel=document.querySelector('#machine'),hrs=document.querySelector('#hours'),out=document.querySelector('#results'),title=document.querySelector('#title'),status=document.querySelector('#status'),themeToggle=document.querySelector('#themeToggle');let category='filtros';const categoryLabels={filtros:'Filtros',rodante:'Material rodante',dentes:'Dentes'};const setTheme=light=>{document.body.classList.toggle('light',light);themeToggle.textContent=light?'◐ Modo escuro':'☀ Modo claro';localStorage.setItem('tema',''+light)};setTheme(localStorage.getItem('tema')==='true');themeToggle.onclick=()=>setTheme(!document.body.classList.contains('light'));[...new Set(machines.map(m=>m.brand))].sort().forEach(b=>brand.add(new Option(b,b)));function updateModels(){const chosen=brand.value,current=sel.value;sel.innerHTML='';sel.add(new Option('Todos os modelos','all'));machines.filter(m=>chosen==='all'||m.brand===chosen).forEach(m=>sel.add(new Option(m.name,m.name)));if([...sel.options].some(o=>o.value===current))sel.value=current;}function render(){const selected=sel.value,period=hrs.value,chosen=brand.value;const data=machines.filter(m=>(chosen==='all'||m.brand===chosen)&&(selected==='all'||m.name===selected));title.textContent=period==='all'?categoryLabels[category]:`${categoryLabels[category]} · plano de ${period==='1000'?'1.000':period} horas`;if(category!=='filtros'){status.textContent=`${data.length} máquina${data.length===1?'':'s'} selecionada${data.length===1?'':'s'}.`;out.innerHTML=`<article class="card"><div class="head"><div><h3>${categoryLabels[category]}</h3><small>Consulta por marca e modelo</small></div><span class="badge">Em atualização</span></div><div class="note">Os códigos de ${category==='rodante'?'material rodante':'dentes'} ainda não constam nas planilhas catalogadas. Quando adicionados, aparecerão aqui para a máquina selecionada.</div></article>`;return}status.textContent=`${data.length} máquina${data.length===1?'':'s'} encontrada${data.length===1?'':'s'}.`;out.innerHTML=data.map(m=>{if(m.catalog)return `<article class="card"><div class="head"><div><h3>${m.name}</h3><small>${m.brand} · catálogo de peças</small></div><span class="badge">Confirmar série</span></div><div class="note">O manual disponível é um catálogo, sem plano de troca por horas. Consulte o número de série para localizar o código correto: <a href="${m.catalog}" target="_blank">abrir catálogo</a>.</div></article>`;const list=period==='all'?[...new Map(Object.values(m.plans).flat().map(x=>[x[0]+x[1],x])).values()]:m.plans[period];return `<article class="card"><div class="head"><div><h3>${m.name}</h3><small>${m.brand}</small></div><span class="badge">${list.length} filtros</span></div><table><thead><tr><th>Código da peça</th><th>Descrição</th><th>Plano</th></tr></thead><tbody>${list.map(x=>`<tr><td><span class="code">${x[0]}</span></td><td>${x[1]}</td><td>${period==='all'?'250–1.000 h':(period==='1000'?'1.000':period)+' h'}</td></tr>`).join('')}</tbody></table></article>`}).join('');}brand.onchange=()=>{updateModels();render()};sel.onchange=render;hrs.onchange=render;document.querySelectorAll('.category-button').forEach(button=>button.onclick=()=>{category=button.dataset.category;document.querySelectorAll('.category-button').forEach(item=>item.classList.toggle('active',item===button));render()});updateModels();render();
  </script>
</body>
</html>
